
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: easy-wheels-server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      # Important: Inside docker, the server needs to reach the frontend via the container name
      - NEXT_BASE_URL=http://frontend:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./easy-wheels
      dockerfile: Dockerfile
    container_name: easy-wheels-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./easy-wheels/.env.local
    environment:
      - NODE_ENV=production
      # Important: Inside docker, the frontend needs to reach the backend via the container name for server-side fetches.
      # For client-side API calls, NEXT_PUBLIC_BASE_URL should remain localhost or your public IP.
      - NEXT_PUBLIC_BASE_URL=http://localhost:8000
    depends_on:
      - server
    restart: unless-stopped
